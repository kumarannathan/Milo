# Builds Milo.app for macOS and attaches the .dmg files to a GitHub release.
# Trigger: push a tag like v0.2.0. The release is created as a draft; publish it when the files look right.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          MILO_DEMO_FAST: '1'
      - run: npm run build
      - run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing + notarization. Repo secrets (Settings → Secrets and variables → Actions):
          #   MAC_CERT_P12         base64 of the "Developer ID Application" certificate exported as .p12
          #   MAC_CERT_PASSWORD    the password you gave that .p12
          #   APPLE_ID             your Apple ID email
          #   APPLE_APP_PASSWORD   an app-specific password from appleid.apple.com
          #   APPLE_TEAM_ID        10-character team id from developer.apple.com/account
          # With the secrets missing, electron-builder skips signing and the build still succeeds.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
